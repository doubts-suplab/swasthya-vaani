name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Phase 0 CI stub: build + test the backend and the frontend. Extend per phase
# (contract tests, infra synth, residency guard — see docs/roadmap.md T7-F04).
jobs:
  backend:
    name: Backend (Java 21 · Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test, format-check
        run: ./mvnw -B verify

  frontend:
    name: Frontend (Node 20 · pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build PWA
        run: pnpm build

  infra:
    name: Infra (AWS CDK · residency guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: CDK tests (assertions + residency guard T7-F04)
        run: pnpm test
      - name: CDK synth
        run: pnpm synth
